name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a vX.Y.Z tag.' }
          .\build.ps1
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if (!(Test-Path -LiteralPath "dist/LocalPDF-Setup-$version-x64.exe")) { throw 'The tag must match the app version.' }
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          gh release create $tag "dist/LocalPDF-Setup-$version-x64.exe" --title "로컬 PDF $version" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }

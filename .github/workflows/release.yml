name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a vX.Y.Z tag.' }
          .\build.ps1
          $version = $env:RELEASE_TAG.Substring(1)
          if (!(Test-Path -LiteralPath "dist/LocalPDF-Setup-$version-x64.exe")) { throw 'The tag must match the app version.' }
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.Substring(1)
          gh release create $tag "dist/LocalPDF-Setup-$version-x64.exe" --title "로컬 PDF $version" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
